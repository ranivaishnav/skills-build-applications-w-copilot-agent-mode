name: Seed Database

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  seed:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 })' || exit 1"
          --health-interval 5s
          --health-timeout 2s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install netcat (wait helper)
        run: sudo apt-get update && sudo apt-get install -y netcat

      - name: Wait for MongoDB
        run: |
          for i in {1..30}; do
            if nc -z localhost 27017; then
              echo "MongoDB is up"; break
            fi
            echo "Waiting for MongoDB..."; sleep 2
          done

      - name: Install dependencies
        run: npm ci

      - name: Run seed script
        env:
          MONGO_URI: mongodb://localhost:27017/octofit_ci
        run: npm run seed
